name: Publish to PyPi
on:
  workflow_dispatch:

jobs:
  details:
    name: Resolve version and check PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: "Require main branch"
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release must be run from main."
            exit 1
          fi

      - name: "Check out code"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: "Read version from pyproject.toml"
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Version from pyproject.toml: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: "Check that version does not already exist on PyPI"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/pdm-datareader/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "::error::pdm-datareader $VERSION already exists on PyPI. Bump the version in pyproject.toml before deploying."
            exit 1
          elif [ "$STATUS" != "404" ]; then
            echo "::error::Unexpected response from PyPI (HTTP $STATUS)."
            exit 1
          fi
          echo "Version $VERSION is not on PyPI; proceeding."

  build:
    name: Build distributions
    needs: details
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Check out code"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: "Set up uv and Python"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: "Build distributions"
        run: uv build

      - name: "Check distribution metadata"
        run: uv tool run --from twine twine check dist/*

      - name: "Upload distributions"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  upload:
    name: Publish to PyPI
    needs: [details, build]
    environment:
      name: release
      url: https://pypi.org/p/pdm-datareader
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: "Download distributions"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: "Publish package distributions to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Create GitHub Release
    needs: [details, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Check out code"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: "Download distributions"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: "Create GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.details.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --generate-notes