name: Test Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-deploy:
    environment:
      name: test_release
      url: https://test.pypi.org/p/pdm-datareader
    permissions:
      contents: read
      id-token: write
    
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ubuntu-latest  
    steps:
      - name: "Check out code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: "Set up uv and Python ${{ matrix.python-version }}"
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:          
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: "Build distribution"
        run: uv build

      - name: "Check distribution metadata"
        run: uv tool run --from twine twine check dist/*
          
      - name: "Publish package distributions to PyPI Test"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
