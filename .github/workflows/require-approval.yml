name: Require Manual Approval for PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  require-approval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add approval requirement comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const isCopilotPR = pr.user.login === 'copilot' || pr.body.includes('Created by Copilot');
            
            if (isCopilotPR) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '👤 **Human approval required** before merge\n\nThis pull request was created by Copilot and requires approval from a human team member before it can be merged. Please review the changes carefully.'
              });
            }
