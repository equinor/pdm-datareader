[project]
name = "pdm-datareader"
version = "2.6.0b1"
description = "A small python package to execute queries to PDM without having to re-authenticate every time"
authors = [{ name = "PDM TEAM", email = "AWL@equinor.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "msal-bearer>=1.6.1,<2.0.0",
    "PyJWT>=2.15.1,<3.0.0",
    "pyodbc>=5.1.0,<6",
    "pandas>=2.2.2,<4.0.0",
    "sqlalchemy>=2.0.36,<3",
    "urllib3>=2.8.0,<3",
    "requests>=2.32.4,<3.0.0",
]

[project.urls]
Repository = "https://github.com/equinor/pdm-datareader"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "black>=26.10.1,<27",
    "responses>=0.25.0,<1.0.0",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
